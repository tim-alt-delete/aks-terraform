name: OpenTofu PR Checks

on:
  pull_request:
    branches:
      - main

# permissions:
#   id-token: write # Require write permission to Fetch an OIDC token.
  # contents: read
  # pull-requests: write
jobs: 
  test:
    permissions:
      id-token: write # Require write permission to Fetch an OIDC token.

    runs-on:
      group: azure-github-demo
    # runs-on: azure-github-demo # ubuntu-latest
    steps:
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
    - name: Verify Azure Login
      uses: azure/cli@v2
      with:
        azcliversion: latest
        inlineScript: |
          az account show
          # You can write your Azure CLI inline scripts here.

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: latest
        #https://github.com/orgs/opentofu/discussions/2493
        tofu_wrapper: false 

    - name: OpenTofu Version
      run: tofu version

    - name: OpenTofu Init
      run: tofu init

    - name: OpenTofu Format Check
      run: tofu fmt -check -recursive -no-color
      #run: tofu fmt -write=false -recursive

    - name: OpenTofu Validate
      run: tofu validate -no-color

